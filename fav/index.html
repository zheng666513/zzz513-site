<!--
  数据：由 sync_fav.py 每 2 小时生成。
  这里不用静态 <script src>，而是在下面的 JS 里带 10 分钟一档的 v= 参数动态载入：
  Cloudflare 自定义域会把 fav.js 的浏览器缓存强制设成 4 小时（zone 的 Browser Cache TTL
  覆盖 Pages 的 _headers），带上变化的参数才能真正绕过缓存。
  页面上的「强制刷新」则用当前毫秒时间戳载入，点一下立刻拿到最新数据。
-->

<script>
(function () {
  'use strict';

  var PAGE_SIZE = 20;
  var VIDEO_BASE = 'https://www.bilibili.com/video/';
  var API_BASE = 'https://api.zzz513.xyz';
  var captchaToken = '';

  var state = {
    all: [],          // 原始列表
    view: [],         // 过滤 + 排序后
    page: 1,
    q: '',
    sort: 'desc'
  };

  var el = {
    grid: document.getElementById('grid'),
    pager: document.getElementById('pager'),
    status: document.getElementById('status'),
    stat: document.getElementById('stat'),
    sync: document.getElementById('syncLine'),
    input: document.getElementById('q'),
    clear: document.getElementById('qClear'),
    sort: document.getElementById('sort'),
    theme: document.getElementById('themeBtn'),
    refresh: document.getElementById('refreshBtn'),
    modal: document.getElementById('refreshModal'),
    captchaImg: document.getElementById('captchaImg'),
    captchaInput: document.getElementById('captchaInput'),
    refreshMsg: document.getElementById('refreshMsg'),
    refreshOk: document.getElementById('refreshOk'),
    refreshCancel: document.getElementById('refreshCancel'),
    refreshClose: document.getElementById('refreshClose'),
    toast: document.getElementById('toast')
  };

  /* ---------------------------------------------------------------- 工具 */

  function pad(n) { return n < 10 ? '0' + n : '' + n; }

  function fmtSync(sec) {
    var n = Number(sec);
    if (!n) return '—';
    var d = new Date(n * 1000);
    if (isNaN(d.getTime())) return '—';
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) +
           ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

  function fmtDay(sec) {
    var n = Number(sec);
    if (!n) return '';
    var d = new Date(n * 1000);
    if (isNaN(d.getTime())) return '';
    return pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }

  /* fav.js 里写的是 /covers/xxx.jpg（站点根），本页在 /fav/ 下，补一个 .. */
  function coverSrc(path) {
    var p = String(path || '');
    if (!p) return '';
    if (p.indexOf('/covers/') === 0) return '..' + p;
    return p;
  }

  function setStatus(text) {
    if (!el.status) return;
    el.status.textContent = text || '';
    el.status.hidden = !text;
  }

  /* ---------------------------------------------------------------- 卡片 */

  function coverNode(item) {
    var box = document.createElement('div');
    box.className = 'cover';

    var img = document.createElement('img');
    img.src = coverSrc(item.cover);
    img.alt = '';
    img.loading = 'lazy';
    img.decoding = 'async';
    img.referrerPolicy = 'no-referrer';

    img.addEventListener('error', function () {
      img.remove();
      box.classList.add('is-empty');
    }, { once: true });

    box.appendChild(img);
    return box;
  }

  function bodyNode(item) {
    var body = document.createElement('div');
    body.className = 'body';

    var title = document.createElement('h2');
    title.className = 'title';
    title.textContent = item.title || '未命名视频';

    var meta = document.createElement('p');
    meta.className = 'meta';

    var up = document.createElement('span');
    up.className = 'up';
    up.textContent = item.upper || '未知 UP 主';
    meta.appendChild(up);

    var day = fmtDay(item.fav_time);
    if (day) {
      var sep = document.createElement('span');
      sep.className = 'sep';
      sep.textContent = '·';
      var time = document.createElement('span');
      time.className = 'time';
      time.textContent = day;
      meta.appendChild(sep);
      meta.appendChild(time);
    }

    body.appendChild(title);
    body.appendChild(meta);
    return body;
  }

  function cardNode(item) {
    var a = document.createElement('a');
    a.className = 'card';
    a.href = VIDEO_BASE + encodeURIComponent(item.bvid || '');
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    a.setAttribute('aria-label', (item.title || '未命名视频') + '，在新标签页打开 B 站');
    a.appendChild(coverNode(item));
    a.appendChild(bodyNode(item));
    return a;
  }

  /* ---------------------------------------------------------------- 过滤 */

  function applyFilter() {
    var q = state.q.trim().toLowerCase();
    var rows = state.all;

    if (q) {
      rows = rows.filter(function (it) {
        return (it.title || '').toLowerCase().indexOf(q) >= 0 ||
               (it.upper || '').toLowerCase().indexOf(q) >= 0;
      });
    }

    rows = rows.slice().sort(function (a, b) {
      var d = (a.fav_time || 0) - (b.fav_time || 0);
      return state.sort === 'asc' ? d : -d;
    });

    state.view = rows;
  }

  /* ---------------------------------------------------------------- 渲染 */

  function renderGrid() {
    var start = (state.page - 1) * PAGE_SIZE;
    var rows = state.view.slice(start, start + PAGE_SIZE);

    el.grid.textContent = '';

    if (!rows.length) {
      el.pager.textContent = '';
      return;
    }

    var frag = document.createDocumentFragment();
    rows.forEach(function (it) { frag.appendChild(cardNode(it)); });
    el.grid.appendChild(frag);
  }

  function pagerNumbers(total, current) {
    /* 1 … 4 5 6 … 10 这种，最多 7 个按钮 */
    var out = [];
    if (total <= 7) {
      for (var i = 1; i <= total; i += 1) out.push(i);
      return out;
    }
    out.push(1);
    var from = Math.max(2, current - 1);
    var to = Math.min(total - 1, current + 1);
    if (from > 2) out.push('…');
    for (var j = from; j <= to; j += 1) out.push(j);
    if (to < total - 1) out.push('…');
    out.push(total);
    return out;
  }

  function renderPager() {
    var total = Math.max(1, Math.ceil(state.view.length / PAGE_SIZE));
    el.pager.textContent = '';

    if (state.view.length <= PAGE_SIZE) return;

    var mk = function (label, page, opts) {
      opts = opts || {};
      var b = document.createElement('button');
      b.type = 'button';
      b.textContent = label;
      if (opts.on) b.className = 'on';
      if (opts.disabled) b.disabled = true;
      if (opts.aria) b.setAttribute('aria-label', opts.aria);
      if (opts.on) b.setAttribute('aria-current', 'page');
      if (!opts.disabled && !opts.on) {
        b.addEventListener('click', function () { goPage(page); });
      }
      return b;
    };

    el.pager.appendChild(mk('上一页', state.page - 1, {
      disabled: state.page <= 1, aria: '上一页'
    }));

    pagerNumbers(total, state.page).forEach(function (n) {
      if (n === '…') {
        var gap = document.createElement('span');
        gap.className = 'gap';
        gap.textContent = '…';
        el.pager.appendChild(gap);
      } else {
        el.pager.appendChild(mk(String(n), n, {
          on: n === state.page, aria: '第 ' + n + ' 页'
        }));
      }
    });

    el.pager.appendChild(mk('下一页', state.page + 1, {
      disabled: state.page >= total, aria: '下一页'
    }));
  }

  function renderStat() {
    var total = state.all.length;
    var matched = state.view.length;

    el.stat.textContent = '';

    var b = document.createElement('b');
    b.textContent = String(total);
    el.stat.appendChild(b);
    el.stat.appendChild(document.createTextNode(' 个收藏'));

    if (state.q.trim() && matched !== total) {
      el.stat.appendChild(document.createTextNode(' · 匹配 ' + matched + ' 个'));
    }
  }

  /* ---------------------------------------------------------------- URL */

  function readUrl() {
    var p = new URLSearchParams(location.search);
    var page = parseInt(p.get('page') || '1', 10);
    var sort = p.get('sort') === 'asc' ? 'asc' : 'desc';
    var q = p.get('search') || '';

    state.page = isNaN(page) || page < 1 ? 1 : page;
    state.sort = sort;
    state.q = q;

    el.input.value = q;
    el.sort.value = sort;
    el.clear.hidden = !q;
  }

  function writeUrl(mode) {
    var p = new URLSearchParams();
    if (state.page > 1) p.set('page', String(state.page));
    if (state.q.trim()) p.set('search', state.q.trim());
    if (state.sort !== 'desc') p.set('sort', state.sort);

    var qs = p.toString();
    var url = location.pathname + (qs ? '?' + qs : '');
    history[mode === 'push' ? 'pushState' : 'replaceState'](
      { page: state.page, q: state.q, sort: state.sort }, '', url
    );
  }

  /* ---------------------------------------------------------------- 动作 */

  function renderAll() {
    applyFilter();

    var total = Math.max(1, Math.ceil(state.view.length / PAGE_SIZE));
    if (state.page > total) state.page = total;
    if (state.page < 1) state.page = 1;

    if (!state.all.length) {
      setStatus('暂无收藏');
    } else if (!state.view.length) {
      setStatus('没有找到相关内容');
    } else {
      setStatus('');
    }

    renderGrid();
    renderPager();
    renderStat();
  }

  function goPage(n) {
    var total = Math.max(1, Math.ceil(state.view.length / PAGE_SIZE));
    var next = Math.min(Math.max(1, n), total);
    if (next === state.page) return;

    state.page = next;
    renderAll();
    writeUrl('push');

    /* 平滑回到内容区顶部，别让用户翻完还停在页脚 */
    var top = el.grid.getBoundingClientRect().top + window.pageYOffset - 90;
    window.scrollTo({ top: top, behavior: 'smooth' });
  }

  function onSearchInput() {
    el.clear.hidden = !el.input.value;
    state.q = el.input.value;
    state.page = 1;
    renderAll();
    writeUrl('replace');
  }

  var timer = 0;
  function onSearchTyping() {
    clearTimeout(timer);
    el.clear.hidden = !el.input.value;
    /* 300ms 防抖：打字期间不动 DOM，停手才过滤 */
    timer = setTimeout(onSearchInput, 300);
  }

  function onSortChange() {
    state.sort = el.sort.value === 'asc' ? 'asc' : 'desc';
    state.page = 1;
    renderAll();
    writeUrl('push');
  }

  function clearSearch() {
    el.input.value = '';
    state.q = '';
    state.page = 1;
    el.clear.hidden = true;
    renderAll();
    writeUrl('replace');
    el.input.focus();
  }

  /* ---------------------------------------------------------------- 强制刷新 */

  var toastTimer = 0;
  function showToast(text) {
    if (!el.toast) return;
    el.toast.textContent = text;
    el.toast.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.toast.hidden = true; }, 3200);
  }

  function modalMsg(text) {
    if (el.refreshMsg) el.refreshMsg.textContent = text || '';
  }

  function setRefreshBusy(busy) {
    if (el.refreshOk) {
      el.refreshOk.disabled = busy;
      el.refreshOk.textContent = busy ? '刷新中…' : '确认刷新';
    }
    if (el.refresh) el.refresh.disabled = busy;
  }

  function loadCaptcha() {
    captchaToken = '';
    el.captchaImg.innerHTML = '<span class="cap-loading">加载中…</span>';
    modalMsg('');
    fetch(API_BASE + '/api/captcha/image', { cache: 'no-store' })
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function (d) {
        if (d.code !== 0 || !d.data || !d.data.svg) {
          throw new Error((d && d.message) || '验证码加载失败');
        }
        captchaToken = d.data.token;
        el.captchaImg.innerHTML = d.data.svg;
        el.captchaInput.value = '';
        el.captchaInput.focus();
      })
      .catch(function (e) {
        el.captchaImg.innerHTML = '<span class="cap-loading">加载失败，点击重试</span>';
        modalMsg('验证码加载失败：' + e.message);
      });
  }

  function openRefresh() {
    el.modal.hidden = false;
    loadCaptcha();
  }

  function closeRefresh() {
    el.modal.hidden = true;
    modalMsg('');
  }

  /* 带时间戳重新取 fav.js，绕过浏览器和 CDN 的缓存 */
  function reloadData() {
    return new Promise(function (resolve, reject) {
      var s = document.createElement('script');
      var settled = false;
      s.src = '../fav.js?ts=' + Date.now();
      s.onload = function () {
        if (settled) return;
        settled = true;
        var d = window.FAV_DATA;
        if (s.parentNode) s.parentNode.removeChild(s);
        if (!d || !Array.isArray(d.list)) { reject(new Error('数据格式异常')); return; }
        resolve(d);
      };
      s.onerror = function () {
        if (settled) return;
        settled = true;
        if (s.parentNode) s.parentNode.removeChild(s);
        reject(new Error('数据加载失败'));
      };
      document.head.appendChild(s);
    });
  }

  /* 触发同步后，等线上时间戳变大：每 10 秒探一次，最多 tries 次 */
  function waitForFresh(before, tries) {
    if (tries <= 0) return Promise.resolve(null);
    var again = function () {
      return new Promise(function (r) { setTimeout(r, 10000); })
        .then(function () { return waitForFresh(before, tries - 1); });
    };
    return reloadData()
      .then(function (d) {
        return Number(d.updated) > before ? d : again();
      })
      .catch(again);
  }

  function applyData(data) {
    state.all = data.list;
    el.sync.innerHTML = '最后同步：<span class="t">' + fmtSync(data.updated) + '</span>';
    renderAll();
  }

  function submitRefresh() {
    var answer = (el.captchaInput.value || '').trim().toUpperCase();
    if (!captchaToken) { modalMsg('验证码还没加载好，请稍候'); return; }
    if (!/^[A-Z0-9]{4}$/.test(answer)) { modalMsg('请输入 4 位验证码'); return; }

    modalMsg('');
    setRefreshBusy(true);
    fetch(API_BASE + '/api/fav/refresh', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ token: captchaToken, answer: answer })
    })
      .then(function (r) {
        return r.json()
          .catch(function () { throw new Error('HTTP ' + r.status); })
          .then(function (d) {
            if (!r.ok || !d || d.code !== 0) {
              throw new Error((d && d.message) || '刷新失败（HTTP ' + r.status + '）');
            }
            return d.data;
          });
      })
      .then(function (info) {
        var before = (window.FAV_DATA && Number(window.FAV_DATA.updated)) || 0;

        /* 后端已经触发 GitHub Actions：等它跑完（约 2 分钟）再刷新 */
        if (info && info.triggered) {
          modalMsg('已触发同步，正在等 GitHub 跑完（约 2 分钟）…');
          return waitForFresh(before, 24).then(function (data) {
            closeRefresh();
            if (data) {
              applyData(data);
              showToast('已更新：' + data.list.length + ' 条 · ' + fmtSync(data.updated));
            } else {
              showToast('同步已排队，稍后刷新页面看结果');
            }
          });
        }

        /* 没配 GitHub 令牌时退化成「只重新读线上文件」 */
        return reloadData().then(function (data) {
          var newer = Number(info.updated) > before;
          applyData(data);
          closeRefresh();
          showToast((newer ? '已载入新数据：' : '已是最新数据：') +
            data.list.length + ' 条 · ' + fmtSync(data.updated));
        });
      })
      .catch(function (e) {
        modalMsg(e.message || String(e));
        loadCaptcha();   /* 失败即换一张，避免拿同一张反复试 */
      })
      .then(function () { setRefreshBusy(false); });
  }

  function initRefresh() {
    if (!el.refresh || !el.modal) return;
    el.refresh.addEventListener('click', openRefresh);
    el.refreshOk.addEventListener('click', submitRefresh);
    el.refreshCancel.addEventListener('click', closeRefresh);
    el.refreshClose.addEventListener('click', closeRefresh);
    el.modal.querySelector('[data-close]').addEventListener('click', closeRefresh);
    el.captchaImg.addEventListener('click', loadCaptcha);
    el.captchaImg.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); loadCaptcha(); }
    });
    el.captchaInput.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') submitRefresh();
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && !el.modal.hidden) closeRefresh();
    });
  }

  /* 页眉工具入口：与首页共用后台「站点设置」里的同一个开关 */
  function initBiliTool() {
    var link = document.getElementById('biliToolLink');
    if (!link) return;
    fetch(API_BASE + '/api/site', { cache: 'no-store' })
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function (d) {
        var site = (d && d.data && d.data.site) || {};
        link.classList.toggle('tool-hidden', site.biliToolEnabled === false);
      })
      .catch(function () {
        /* 接口异常时保持默认显示，别让入口莫名其妙消失 */
      });
  }

  /* ---------------------------------------------------------------- 主题 */

  function syncThemeLabel() {
    var night = document.documentElement.getAttribute('data-skin') === 'night';
    el.theme.textContent = night ? '纸白' : '深夜';
    el.theme.setAttribute('aria-pressed', night ? 'true' : 'false');
  }

  function initTheme() {
    el.theme.addEventListener('click', function () {
      var night = document.documentElement.getAttribute('data-skin') === 'night';
      var next = night ? 'paper' : 'night';
      document.documentElement.setAttribute('data-skin', next);
      try { localStorage.setItem('zzz513.skin', next); } catch (e) {}
      syncThemeLabel();
    });
    syncThemeLabel();
  }

  /* ---------------------------------------------------------------- 启动 */

  function boot() {
    initTheme();
    initBiliTool();
    initRefresh();
    readUrl();

    var data = window.FAV_DATA;

    if (!data || !Array.isArray(data.list)) {
      el.sync.innerHTML = '最后同步：<span class="t">—</span>';
      setStatus('数据加载失败');
      el.stat.textContent = '';
      return;
    }

    applyData(data);

    el.input.addEventListener('input', onSearchTyping);
    el.clear.addEventListener('click', clearSearch);
    el.sort.addEventListener('change', onSortChange);

    /* 前进 / 后退：把页码、搜索词、排序一起还原 */
    window.addEventListener('popstate', function () {
      readUrl();
      renderAll();
    });
  }

  /* 带版本号取数据：10 分钟一档，既绕过 4 小时的强制浏览器缓存，
     又不会让每次刷新都回源。「强制刷新」另用毫秒时间戳，立刻拿最新版。 */
  function loadInitialData() {
    var s = document.createElement('script');
    var settled = false;
    /* 每次都用新地址，避免 4 小时浏览器缓存把「最后同步」显示成旧时间 */
    s.src = '../fav.js?ts=' + Date.now();
    s.onload = s.onerror = function () {
      if (settled) return;
      settled = true;
      if (s.parentNode) s.parentNode.removeChild(s);
      boot();
    };
    document.head.appendChild(s);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', loadInitialData);
  } else {
    loadInitialData();
  }
})();
</script>

</body>
</html>
